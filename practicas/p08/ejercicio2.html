<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 2</title>
    <style type="text/css">
    td, th { border: 1px solid #CCC; }
    table {border: 1px solid black; }
</style>
</head>
<body>
    <table>
    <!--Strong remarca el contenido de las celdas-->
    <tr>
        <td><strong>7:00pm</strong></td>
        <td><strong>7:30pm</strong></td>
        <td><strong>8:00pm</strong></td>
    </tr>
   <!--colpsan indica cuantas columnas abarcaran el espacio de una celda--> 
    <tr>
        <td colspan="3">The Sunday Night Movie</td>
    </tr>

    <tr>
        <td>Perry Mason</td>
        <td>Candid Camera</td>
        <td>What's My Line</td>
    </tr>

    <tr>
        <td>Bonanza</td>
        <td colspan="2">The Wackiest Ship in the Army</td>
    </tr>
    </table>
</body>
</html>
