<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 3-Union de filas</title>
    <style type="text/css">
    td, th { border: 1px solid #CCC; }
    table {border: 1px solid black; }
</style>
</head>
<body>
    <table>
    <!--rowspan indica que tabtas celdas de forma horizontal va a unir-->
    <tr>
        <td>apples</td>
        <td rowspan="3">oranges</td>
        <td>pears</td>
    </tr>

    <tr>
        <td>bananas</td>
        <td rowspan="2">pineapple</td>
    </tr>

    <tr>
        <td>lychees</td>
    </tr>
    </table>
</body>
</html>
